apiVersion: actions.github.upbound.io/v1alpha1
kind: ActionsSecret
metadata:
  annotations:
    meta.upbound.io/example-id: actions/v1alpha1/actionssecret
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    repositorySelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretName: EXAMPLE_SECRET_NAME
    valueSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
