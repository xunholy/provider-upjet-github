apiVersion: actions.github.m.upbound.io/v1alpha1
kind: EnvironmentSecret
metadata:
  annotations:
    meta.upbound.io/example-id: actions/v1alpha1/environmentsecret
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    environmentSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    repositorySelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretName: EXAMPLE_SECRET_NAME
    valueSecretRef:
      key: example-key
      name: example-secret
